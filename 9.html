2. WAHRHEIT-Formel korrigieren

Aktuell:

JavaScript
((tmp * (81 - (activeSlot % 9) * 9) / 729).toFixed(2));

Dadurch entstehen:

Plain Text
81
72
63
54
...
9

Die ursprüngliche WURZEL-Logik aus wurzel verwendet jedoch:

JavaScript
RAR = 81 - (slot % 9)

also:

JavaScript
const rar = 81 - (activeSlot % 9);
 
((tmp * rar / 729).toFixed(2))
3. Robuster Zugriff auf WURZEL_STATE

Momentan:

JavaScript
const S = WURZEL_STATE._S;

Falls wurzel-state.js noch nicht geladen ist:

JavaScript
Uncaught ReferenceError:
WURZEL_STATE is not defined

Robuster:

JavaScript
if(typeof WURZEL_STATE === "undefined"){
return;
}
 
const S = WURZEL_STATE._S;

Quellen
Bereinige den Code vollständig

Ja. Der gepostete Code hat vor allem diese Probleme:

Ungültige <br>-Tags in <style> und <script>.
Möglicher Fehler, wenn wurzel-state.js fehlt.
Doppelte Active-Navigation-Logik.
Nicht verwendete Variablen (fehler, warnung).
Falsche WAHRHEIT-Berechnung.
Active-Room/Active-Slot Synchronisation kann inkonsistent werden.
Mobile-Titel zeigt Dateiname statt aktuellem Knoten.

Die bereinigte Fassung sollte mindestens diese JavaScript-Version verwenden:

JavaScript
const ROOMS = [
['111','BIOS'],
['222','VERBUND'],
['333','RECALL'],
['444','PEAK'],
['555','ABWEHR'],
['666','ENERGIE'],
['777','CO2'],
['888','ATOM'],
['999','BENCH']
];
 
const TRI = [
['9','EVIG','Zustand, nicht Zähler'],
['99','EDIT TOR','CALL · RECALL · ALLCALL'],
['999','NUTZ SYSTEM','BENCH – alle 9 auf einer Bank']
];
 
let activeRoom = 0;
 
/* Navigation */
 
const current =
(location.pathname.split('/').pop() || 'index')
.replace('.html','')
.toLowerCase();
 
document
.querySelectorAll('.kopf-nav a, #mobile-panel a')
.forEach(a => {
 
const target =
a.getAttribute('href')
.replace('./','')
.replace('.html','')
.toLowerCase();
 
if (
target === current ||
(current === '' && target === 'index')
) {
a.classList.add('active');
}
 
});
 
const mobileToggle =
document.getElementById('mobile-toggle');
 
const mobilePanel =
document.getElementById('mobile-panel');
 
mobileToggle.addEventListener(
'click',
() => mobilePanel.classList.toggle('open')
);
 
/* Räume */
 
document.getElementById('rooms').innerHTML =
ROOMS.map(
(r,i)=>
`<button data-room="${i}">${r[0]}</button>`
).join('');
 
/* Zeichnen */
 
function draw(){
 
if(
typeof WURZEL_STATE === 'undefined'
){
return;
}
 
const S = WURZEL_STATE._S;
 
let activeSlot =
Number.isInteger(S.activeSlot)
? S.activeSlot
: 0;
 
activeRoom =
Math.max(
0,
Math.min(
8,
Math.floor(activeSlot / 9)
)
);
 
const rm =
ROOMS[activeRoom];
 
const tri =
TRI[Math.floor(activeRoom / 3)];
 
const Z =
WURZEL_STATE.zustand();
 
const tmp =
WURZEL_STATE.tmp();
 
const rar =
81 - (activeSlot % 9);
 
const wahrheit =
(tmp * rar / 729).toFixed(2);
 
document
.querySelectorAll('[data-room]')
.forEach((b,i)=>{
 
b.classList.toggle(
'on',
i === activeRoom
);
 
});
 
document.getElementById(
'room-node-info'
).innerHTML =
`◉ ACTIVE NODE ${rm[0]} // ${rm[1]} → ${tri[0]} ${tri[1]}`;
 
document.getElementById(
'rinfo'
).textContent =
`Raum ${rm[0]} ${rm[1]} · TMP ${tmp} · WAHRHEIT ${wahrheit}`;
 
document.getElementById(
'core-val'
).textContent =
tri[0];
 
document.getElementById(
'core-sub'
).textContent =
`${tri[1]} — ${tri[2]}`;
 
document.getElementById(
'wurzeln-live'
).innerHTML =
['HOME','ORT','PRUEF']
.map(name => `
<div class="w-box ${name.toLowerCase()}">
<div class="lbl">${name}</div>
<div class="val">${Z[name] ?? '-'}</div>
</div>
`)
.join('');
 
const headerState =
document.getElementById(
'brain-state'
);
 
if(
Z.PRUEF === 'FEHLER' ||
Z.HOME === 'CLOSED'
){
headerState.textContent =
'● BRAIN.EYE.CLOSED';
 
headerState.className =
'kopf-state bad';
 
}else if(
Z.PRUEF === 'UNGEPRUEFT'
){
headerState.textContent =
'● BRAIN.EYE.WAIT';
 
headerState.className =
'kopf-state warn';
 
}else{
 
headerState.textContent =
'● BRAIN.EYE.OPEN';
 
headerState.className =
'kopf-state';
 
}
 
mobileToggle.textContent =
`☰ NODE : ${rm[0]} / ${tri[0]}`;
}
 
/* Events */
 
document.addEventListener(
'click',
e => {
 
const b =
e.target.closest(
'[data-room]'
);
 
if(!b) return;
 
activeRoom =
Number(b.dataset.room);
 
if(
typeof WURZEL_STATE !== 'undefined'
){
 
const slot =
activeRoom * 9;
 
WURZEL_STATE._S.activeSlot =
slot;
 
if(
typeof WURZEL_STATE.slotSet
=== 'function'
){
WURZEL_STATE.slotSet(
slot,
true
);
}
 
}
 
draw();
 
}
);
 
if(
typeof WURZEL_STATE !==
'undefined'
){
 
WURZEL_STATE.onRemote =
draw;
 
draw();
 
}

Zusätzlich solltest du alle <br> innerhalb von <style> und <script> löschen, da sie dort syntaktisch ungültig sind. Das ist aktuell der größte Fehler in deiner Datei.
