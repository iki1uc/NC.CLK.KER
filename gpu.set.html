    --surface2:#0b182e;
  }
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text)
}

body{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  overflow-x:clip
}

button,input,textarea{
  font:inherit
}

button{
  cursor:pointer
}

@keyframes fireBorder{
  0%{
    box-shadow:0 0 0 #ff3d00,0 0 28px #ff3d00
  }

  50%{
    box-shadow:0 0 24px #ffe600,0 0 70px #ff2ea6
  }

  100%{
    box-shadow:0 0 0 #ff3d00,0 0 28px #ff3d00
  }
}

@keyframes glitch{
  0%,88%{
    transform:translate(0)
  }

  89%{
    transform:translate(-3px,2px) skewX(-8deg)
  }

  91%{
    transform:translate(3px,-2px)
  }

  93%{
    transform:translate(-2px,1px)
  }

  95%{
    transform:translate(0)
  }
}

@keyframes pulseNeon{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.55
  }
}

@keyframes rainbowMove{
  0%{
    background-position:0% 50%
  }

  100%{
    background-position:200% 50%
  }
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}

@keyframes flicker{
  0%,100%{
    opacity:1
  }

  48%{
    opacity:.72
  }

  52%{
    opacity:1
  }

  76%{
    opacity:.82
  }
}

.fire-border{
  animation:fireBorder 1.1s infinite
}

.glitch{
  animation:glitch 2.6s infinite
}

.rainbow{
  background:linear-gradient(90deg,#ff3d00,#ffe600,#39ff6a,#00f0ff,#ff2ea6,#ff3d00);
  background-size:200% 100%;
  animation:rainbowMove 3s linear infinite
}

.scroll-thin::-webkit-scrollbar{
  height:8px;
  width:8px
}

.scroll-thin::-webkit-scrollbar-thumb{
  background:#ff3d00;
  border-radius:99px
}

input[type=range]{
  accent-color:#ff3d00
}

.hover\:border-\[\#ff3d00\]:hover {
  --tw-border-opacity: 1;
  border-color: rgb(255 61 0 / var(--tw-border-opacity, 1));
}

@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }

  .sm\:h-\[480px\] {
    height: 480px;
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:py-6 {
    padding-top: 1.5rem;
    padding-bottom: 1.5rem;
  }

  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1fr_300px\] {
    grid-template-columns: 1fr 300px;
  }
}
