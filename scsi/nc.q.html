:root {
  --bg: #050805;
  --surface: #0b0f0b;
  --surface-2: #111711;
  --gold: #f2c94c;
  --purple: #b388ff;
  --green: #4ade80;
  --red: #ff4d4d;
  --ink: #f4eedc;
  --muted: #a8ad9f;
  --line: #2b3128;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050805;
    --surface: #0b0f0b;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

button {
  font: inherit;
}

.grid-cell {
  transition: transform .12s ease, background .15s ease, border-color .15s ease;
}

.grid-cell:hover {
  transform: translateY(-1px);
}

.grid-cell:focus-visible, .toggle:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

@keyframes pulse-dot {
  0%,100% {
    opacity: 1;
  }

  50% {
    opacity: .35;
  }
}

.live-dot {
  animation: pulse-dot 1.6s ease-in-out infinite;
}

@media (min-width: 640px) {
  .sm\:gap-1\.5 {

    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-3xl {
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-5xl {
    font-size: 3rem;
    line-height: 1;
  }

  .sm\:text-6xl {
    font-size: 3.75rem;
    line-height: 1;
  }

  .sm\:text-\[13px\] {
    font-size: 13px;
  }

  .sm\:text-\[68px\] {
    font-size: 68px;
  }

  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }

  .sm\:text-lg {
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .sm\:leading-8 {
    line-height: 2rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:mt-0 {
    margin-top: 0px;
  }

  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[\.9fr_1\.1fr\] {
    grid-template-columns: .9fr 1.1fr;
  }

  .lg\:grid-cols-\[1\.35fr_\.65fr\] {
    grid-template-columns: 1.35fr .65fr;
  }

  .lg\:grid-cols-\[1\.65fr_\.85fr\] {
    grid-template-columns: 1.65fr .85fr;
  }

  .lg\:grid-cols-\[1\.75fr_\.75fr\] {
    grid-template-columns: 1.75fr .75fr;
  }

  .lg\:grid-cols-\[1fr_1\.25fr\] {
    grid-template-columns: 1fr 1.25fr;
  }

  .lg\:px-10 {
    padding-left: 2.5rem;

  .lg\:py-14 {
    padding-top: 3.5rem;
    padding-bottom: 3.5rem;
  }

  .lg\:text-\[78px\] {
    font-size: 78px;
  }
}
