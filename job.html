}

:root{
  --bg:#03060c;
  --surface:#07101f;
  --surface2:#0a1629;
  --line:#1e3a5f;
  --text:#e8f6ff;
  --muted:#8fb4d6;
  --neon:#00f0ff;
  --pink:#ff2ea6;
  --yellow:#ffe600;
  --green:#00ff88;
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace
}

a{
  color:inherit
}

button,input{
  font-family:inherit
}

::-moz-selection{
  background:var(--pink);
  color:white
}

::selection{
  background:var(--pink);
  color:white
}

.neon-text{
  color:var(--neon);
  text-shadow:0 0 8px rgba(0,240,255,.9),0 0 22px rgba(0,240,255,.45)
}

.pink-text{
  color:var(--pink);
  text-shadow:0 0 8px rgba(255,46,166,.8)
}

.card{
  background:linear-gradient(180deg,#081426 0%,#050b18 100%);
  border:1px solid #1e3a5f;
  box-shadow:0 0 0 1px rgba(0,240,255,.08),0 18px 40px rgba(0,0,0,.45);
}

.card:hover{
  border-color:#00f0ff;
  box-shadow:0 0 24px rgba(0,240,255,.18),0 18px 40px rgba(0,0,0,.45)
}

.chip{
  border:1px solid var(--line);
  background:#07101f
}

.btn-active-f{
  background:var(--pink);
  color:#fff;
  box-shadow:0 0 16px rgba(255,46,166,.6)
}

.btn-active-l{
  background:var(--neon);
  color:#03060c;
  box-shadow:0 0 16px rgba(0,240,255,.6)
}

.btn-active-b{
  background:linear-gradient(90deg,var(--pink),var(--neon));
  color:#03060c;
  box-shadow:0 0 16px rgba(0,240,255,.35)
}

@keyframes orbPulse{
  0%,100%{
    transform:scale(1);
    box-shadow:0 0 18px #ff2ea6,0 0 45px #00f0ff
  }

  50%{
    transform:scale(1.18);
    box-shadow:0 0 32px #ff2ea6,0 0 70px #00f0ff
  }
}

@keyframes sortA{
  0%,100%{
    height:18px
  }

  50%{
    height:52px
  }
}

@keyframes sortB{
  0%,100%{
    height:48px
  }

  50%{
    height:14px
  }
}

@keyframes sortC{
  0%,100%{
    height:30px
  }

  50%{
    height:58px
  }
}

@keyframes merge{
  0%{
    transform:translate(0,0) scale(1);
    opacity:1
  }

  45%{
    transform:translate(var(--dx),var(--dy)) scale(.6);
    opacity:.7
  }

  70%{
    transform:translate(0,0) scale(1.3)
  }

  100%{
    transform:translate(0,0) scale(1)
  }
}

@keyframes heartDash{
  0%{
    stroke-dashoffset:360
  }

  100%{
    stroke-dashoffset:0
  }
}

@keyframes blinkDot{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.15
  }
}

@keyframes floatY{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-4px)
  }
}

@keyframes scan{
  0%{
    left:-20%
  }

  100%{
    left:110%
  }
}

@keyframes doorGlow{
  0%,100%{
    box-shadow:0 0 6px rgba(255,230,0,.3)
  }

  50%{
    box-shadow:0 0 22px rgba(255,230,0,.95)
  }
}

@keyframes eyeBlink{
  0%,92%,100%{
    transform:scaleY(1)
  }

  95%{
    transform:scaleY(.08)
  }
}

.anim-orb{
  animation:orbPulse 1.8s ease-in-out infinite
}

.anim-merge{
  animation:merge 2.6s ease-in-out infinite
}

.anim-float{
  animation:floatY 2.2s ease-in-out infinite
}

.anim-blink{
  animation:blinkDot 1.1s steps(2) infinite
}

.anim-door{
  animation:doorGlow 1.6s ease-in-out infinite
}

.anim-eye{
  animation:eyeBlink 4.5s ease-in-out infinite
}

.heart-line{
  stroke-dasharray:360;
  animation:heartDash 2.2s linear infinite
}

input[type=range]{
  accent-color:#00f0ff
}

input[type=range].mixer{
  accent-color:#ff2ea6
}

.scroll-row{
  scrollbar-width:thin
}

.placeholder\:text-white\/35::-moz-placeholder {
  color: rgb(255 255 255 / 0.35);
}

.placeholder\:text-white\/35::placeholder {
  color: rgb(255 255 255 / 0.35);
}

.hover\:border-\[\#00f0ff\]:hover {
  --tw-border-opacity: 1;
  border-color: rgb(0 240 255 / var(--tw-border-opacity, 1));
}

.hover\:bg-\[\#00f0ff\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(0 240 255 / var(--tw-bg-opacity, 1));
}

.hover\:text-black:hover {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.hover\:text-white:hover {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:gap-4 {
    gap: 1rem;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:text-left {
    text-align: left;
  }

  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }

  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }

  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 1024px) {
  .lg\:ml-auto {
    margin-left: auto;
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1fr_360px\] {
    grid-template-columns: 1fr 360px;
  }

  .lg\:flex-row {
    flex-direction: row;
  }

  .lg\:items-center {
    align-items: center;
  }
}
